<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 56" width="185" height="56" fill="none">
  <!-- Brand Icon: Precision Metrology Shield & Scale -->
  <g transform="translate(6, 6)">
    <!-- Outer Hexagonal Verification Shield -->
    <path d="M 22 0 L 40 10 L 40 32 L 22 44 L 4 32 L 4 10 Z" fill="#0A314D" />
    <path d="M 22 3 L 37 11.5 L 37 30.5 L 22 40.5 L 7 30.5 L 7 11.5 Z" fill="#FFFFFF" opacity="0.1" />
    
    <!-- Central Beam Balance & Verification Check -->
    <!-- Fulcrum Post -->
    <rect x="20.5" y="12" width="3" height="22" rx="1" fill="#FFFFFF" />
    <!-- Horizontal Scale Beam -->
    <path d="M 10 16 L 34 16" stroke="#FBAC1B" stroke-width="2.5" stroke-linecap="round" />
    <!-- Left Scale Pan -->
    <path d="M 12 16 L 9 24 L 17 24 Z" fill="#FBAC1B" opacity="0.9" />
    <!-- Right Scale Pan -->
    <path d="M 32 16 L 29 24 L 37 24 Z" fill="#FBAC1B" opacity="0.9" />
    <!-- Base Platform -->
    <rect x="15" y="32" width="14" height="3" rx="1.5" fill="#FFFFFF" />
    <!-- Central Metric Calibrated Dial -->
    <circle cx="22" cy="16" r="3.5" fill="#0A314D" stroke="#FBAC1B" stroke-width="1.5" />
    <circle cx="22" cy="16" r="1.2" fill="#FFFFFF" />
  </g>

  <!-- Typography: PARAKH + Subtitle -->
  <text x="60" y="31" font-family="'Noto Sans', sans-serif" font-size="25" font-weight="800" fill="#0A314D" letter-spacing="0.04em">PARAKH</text>
  <text x="61" y="44" font-family="'Noto Sans', sans-serif" font-size="8.5" font-weight="600" fill="#55565E" letter-spacing="0.14em">LEGAL METROLOGY</text>
</svg>