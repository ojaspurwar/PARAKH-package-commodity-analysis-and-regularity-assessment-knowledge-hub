kind = "web"
previewPath = "/"
title = "Legal Metrology Assistant"
description = "A bilingual enforcement workspace for field officers to scan product labels, review compliance results, queue offline submissions, and help supervisors monitor live audit activity."
version = "1.0.0"
id = "artifacts/metrology-assistant"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22321

[services.development]
run = "pnpm --filter @workspace/metrology-assistant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/metrology-assistant", "run", "build" ]
serve = "static"
publicDir = "artifacts/metrology-assistant/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22321"
BASE_PATH = "/"
